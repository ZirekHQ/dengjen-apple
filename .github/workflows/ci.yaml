name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: DengjenCore tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift test
        run: swift test --package-path Packages/DengjenCore

  app:
    name: Build the app and extension (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache libdengjen
        id: libdengjen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Frameworks/Libdengjen.xcframework
          key: libdengjen-${{ hashFiles('libdengjen.lock', 'scripts/fetch-libdengjen.sh') }}
      - name: Install build tools
        run: brew install xcodegen llvm protobuf
      - name: Fetch libdengjen
        if: steps.libdengjen.outputs.cache-hit != 'true'
        run: scripts/fetch-libdengjen.sh
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project Dengjen.xcodeproj -scheme Dengjen -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check the extension is embedded and declares a speech audio unit
        run: |
          set -euo pipefail
          app=build/Build/Products/Release/Dengjen.app
          appex="$app/Contents/PlugIns/DengjenSpeech.appex"
          test -d "$appex"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$appex/Contents/Info.plist" \
            | grep -qx com.apple.AudioUnit-Speech
          plutil -extract NSExtension.NSExtensionAttributes.AudioComponents.0.type raw \
            "$appex/Contents/Info.plist" | grep -qx ausp
